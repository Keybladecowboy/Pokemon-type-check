<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature Tag</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#161213">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nature Tag">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg:#161213;
    --panel:#201819;
    --panel-2:#2a1c1d50;
    --line:#3a2224;
    --text:#f7eeee;
    --dim:#a68a8a;
    --accent:#e0242a;
    --good:#57d97a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #2a1414 0%, transparent 45%),
      radial-gradient(circle at 100% 30%, #241010 0%, transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    padding:20px 12px 50px;
  }
  .wrap{max-width:720px; margin:0 auto;}

  /* --- Handheld device frame --- */
  .device-frame{
    background:
      linear-gradient(155deg, #ec3a3f 0%, #c81820 55%, #a3141a 100%);
    border-radius:26px;
    padding:14px 14px 20px;
    box-shadow:
      0 12px 30px rgba(0,0,0,.45),
      inset 0 2px 0 rgba(255,255,255,.25),
      inset 0 -6px 14px rgba(0,0,0,.25);
    margin-bottom:8px;
  }
  .device-top{
    display:flex;
    align-items:center;
    gap:10px;
    padding:4px 6px 14px;
  }
  .lens{
    width:30px; height:30px;
    border-radius:50%;
    background:radial-gradient(circle at 32% 30%, #d8f4ff 0%, #6fc3ef 35%, #1c7fb8 70%, #0e4d70 100%);
    border:3px solid #fff;
    box-shadow:0 0 0 2px rgba(0,0,0,.2), 0 2px 4px rgba(0,0,0,.3);
    flex-shrink:0;
  }
  .status-dots{display:flex; gap:5px; margin-left:2px;}
  .status-dots span{
    width:7px; height:7px; border-radius:50%;
    box-shadow:0 1px 2px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,.3);
  }
  .status-dots .d1{background:#ff5c5c; box-shadow:0 0 5px #ff5c5c, inset 0 0 0 1px rgba(255,255,255,.3);}
  .status-dots .d2{background:#ffd23f; animation:dot-glow 1.6s ease-in-out infinite;}
  .status-dots .d3{background:#57d97a; box-shadow:0 0 5px #57d97a, inset 0 0 0 1px rgba(255,255,255,.3);}
  @keyframes dot-glow{
    0%, 100% { box-shadow:0 0 4px #ffd23f, inset 0 0 0 1px rgba(255,255,255,.3); }
    50%      { box-shadow:0 0 11px 2px #ffd23f, inset 0 0 0 1px rgba(255,255,255,.3); }
  }
  .device-top .device-label{
    margin-left:auto;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.14em;
    color:rgba(255,255,255,.75);
    text-transform:uppercase;
  }

  .screen{
    background:var(--bg);
    border-radius:16px;
    padding:20px 16px 8px;
    box-shadow:
      inset 0 0 0 2px rgba(0,0,0,.35),
      inset 0 3px 10px rgba(0,0,0,.5);
  }

  .device-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 10px 2px;
    flex-wrap:wrap;
    gap:8px;
  }
  .bezel-btn{
    background:#a9a9a9;
    border:1px solid #888;
    color:#ffffff;
    font-size:12px;
    font-weight:600;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    font-family:'Space Grotesk', sans-serif;
    text-decoration:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 2px 4px rgba(0,0,0,.3);
    transition:.15s;
  }
  .bezel-btn:hover:not(:disabled){background:#b8b8b8; border-color:#999;}
  .bezel-btn:disabled{opacity:.4; cursor:not-allowed;}
  .bezel-btn.accent{
    background:var(--accent);
    color:#ffffff;
    border-color:var(--accent);
  }
  .bezel-btn.accent:hover:not(:disabled){background:#c81f24; border-color:#c81f24;}
  .speaker-lines{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .speaker-lines span{
    display:block;
    width:60px; height:4px;
    border-radius:2px;
    background:rgba(0,0,0,.3);
    box-shadow:0 1px 0 rgba(255,255,255,.12);
  }
  .speaker-lines span:nth-child(2){width:44px;}
  .speaker-lines span:nth-child(3){width:52px;}

  header{margin-bottom:24px;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:8px;
  }
  h1{
    font-size:clamp(24px,6vw,36px);
    font-weight:700;
    margin:0 0 8px;
    letter-spacing:-0.02em;
  }
  header p{
    color:var(--dim);
    font-size:13.5px;
    line-height:1.5;
    margin:0;
    max-width:52ch;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-bottom:16px;
  }
  .card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  .card h2{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--dim);
    margin:0;
    font-weight:600;
  }

 
  .preview-box{
    width:100%;
    aspect-ratio:16/9;
    background:#12131c;
    border:1px solid var(--line);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .preview-box img{width:100%; height:100%; object-fit:contain; pointer-events:none;}
  .preview-box video{width:100%; height:100%; object-fit:cover;}
  .preview-placeholder{color:var(--dim); font-size:13px; text-align:center;}

  /* Scaled grid matching Switch 6-slot card positions */
  .preview-overlay-grid{
    position:absolute;
    top:24.5%;
    bottom:16%;
    left:9%;
    right:9%;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:repeat(3, 1fr);
    gap:8px 12px;
    pointer-events:none;
    z-index:2;
  }
  .preview-slot-box{
    border:2px dashed rgba(255,255,255,.7);
    border-radius:6px;
    background:rgba(255,255,255,.05);
    display:flex;
    align-items:flex-end;
    justify-content:flex-end;
    padding:4px 6px;
  }
  .preview-slot-num{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    font-weight:700;
    color:#fff;
    background:rgba(224,36,42,.9);
    padding:1px 5px;
    border-radius:3px;
  }

  /* Fullscreen camera capture with locked 16:9 horizontal frame */
  .camera-overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(10,6,6,.95);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:16px;
    gap:16px;
  }
  .camera-overlay.open{display:flex;}

  .camera-frame{
    position:relative;
    width:min(92vw, calc((100vh - 130px) * (16 / 9)));
    aspect-ratio:16 / 9;
    background:linear-gradient(155deg, #ec3a3f 0%, #c81820 55%, #a3141a 100%);
    border-radius:22px;
    padding:12px;
    box-shadow:
      0 20px 50px rgba(0,0,0,.7),
      inset 0 2px 0 rgba(255,255,255,.25),
      inset 0 -6px 14px rgba(0,0,0,.25);
  }
  .camera-stage{
    position:relative;
    width:100%;
    height:100%;
    border-radius:14px;
    overflow:hidden;
    background:#000;
  }
  .camera-stage video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .camera-stage.ios-landscape-fix video {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(90deg);
  object-fit: cover;
}

  .shutter-overlay-btn{
    width:62px;
    height:62px;
    border-radius:50%;
    background:#fff;
    border:4px solid rgba(255,255,255,.5);
    cursor:pointer;
    box-shadow:0 0 16px rgba(0,0,0,.6);
    z-index:1010;
    flex-shrink:0;
    transition:transform .1s ease;
  }
  .shutter-overlay-btn:active{transform:scale(.92);}

  .cancel-overlay-btn{
    position:absolute;
    top:16px;
    right:16px;
    background:rgba(0,0,0,.6);
    border:1px solid rgba(255,255,255,.3);
    color:#fff;
    border-radius:50%;
    width:36px;
    height:36px;
    cursor:pointer;
    z-index:1010;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
  }
  
  .label-overlay{
    position:absolute;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(10px, 2.2vw, 14px);
    cursor:grab;
    user-select:none;
    touch-action:none;
    padding:2px 6px;
    white-space:nowrap;
  }
  .label-overlay:active{cursor:grabbing;}
  .label-overlay.active{outline:2px dashed var(--accent); outline-offset:3px;}

  /* Roster — one row per tagged Pokémon */
  .roster-item{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:10px 12px;
    margin-bottom:8px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    cursor:pointer;
  }
  .roster-item:hover{border-color:var(--accent);}
  .roster-item.active{border-color:var(--accent); background:rgba(224,36,42,.1);}

  .roster-main-row{display:flex; align-items:center; gap:10px;}
  .roster-index{
    display:flex;
    align-items:center;
    justify-content:center;
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid var(--dim);
    font-size:11px;
    font-weight:700;
    flex-shrink:0;
  }
  .roster-nature{
    background:#12131c;
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--text);
    padding:6px 10px;
    font-size:12px;
    font-family:'Space Grotesk', sans-serif;
    cursor:pointer;
    flex:1;
  }
  .roster-nature:focus{outline:2px solid var(--accent); outline-offset:-1px;}
  .roster-delete{color:var(--accent); background:none; border:none; font-size:14px; cursor:pointer; padding:4px;}

  .roster-tools{
    display:flex;
    gap:12px;
    align-items:center;
    font-size:11px;
    color:var(--dim);
    padding-top:6px;
    border-top:1px dashed var(--line);
  }
  .roster-tools label{display:flex; align-items:center; gap:6px; flex:1;}
  .roster-tools input[type="range"]{flex:1; accent-color:var(--accent);}

  .tag-count{
    font-size:11px;
    font-weight:600;
    color:var(--accent);
  }

  .empty-state{
    text-align:center;
    padding:30px 10px;
    color:var(--dim);
    font-size:14px;
  }

  input[type="file"]{display:none;}

  footer{
    text-align:center;
    color:var(--dim);
    font-size:12px;
    margin-top:30px;
    font-family:'JetBrains Mono', monospace;
  }
</style>
</head>
<body>
<div class="wrap">
<div class="device-frame">
  <div class="device-top">
    <div class="lens"></div>
    <div class="status-dots">
      <span class="d1"></span>
      <span class="d2"></span>
      <span class="d3"></span>
    </div>
    <a href="./index.html" class="device-label" style="cursor:pointer; text-decoration:none; background:#a9a9a9; color:#ffffff; padding:6px 12px; border-radius:6px; border:1px solid #888; display:inline-block; transition:.15s; box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 2px 4px rgba(0,0,0,.3); font-weight:600;">Type Check</a>
  </div>
  <div class="screen">
  <header>
    <div class="eyebrow">Nature Tagger // 002</div>
    <h1>Tag Natures</h1>
    <p>Load a team screenshot, place nature labels on each Pokémon, and download the annotated image.</p>
  </header>

  <div class="card">
    <div class="card-header">
      <h2>Load photo</h2>
      <button class="bezel-btn" id="gridBtn" style="display:none;">🎯 Auto 6-grid</button>
    </div>
    <div class="preview-box" id="previewBox">
      <div class="preview-placeholder">No photo loaded</div>
    </div>
  </div>

  <div class="card" id="rosterCard" style="display:none;">
    <div class="card-header">
      <h2>Label natures</h2>
      <span class="tag-count" id="tagCount">0 tagged</span>
    </div>
    <div id="rosterList"></div>
  </div>

  <div class="card" id="hintCard">
    <div class="empty-state" id="hint">Tap "Photo" or "Library" below to load a team screenshot.</div>
  </div>
  </div>

  <div class="device-bottom">
    <button class="bezel-btn" id="cameraBtn">📷 Photo</button>
    <button class="bezel-btn" id="libraryBtn">🖼 Library</button>
    <button class="bezel-btn" id="clearAllBtn" disabled>🗑 Clear</button>
    <button class="bezel-btn accent" id="downloadBtn" disabled>⬇ Save</button>
    <div class="speaker-lines"><span></span><span></span><span></span></div>
  </div>
</div>

<input id="fileInput" type="file" accept="image/*">
<input id="cameraInput" type="file" accept="image/*" capture="environment">

<div class="camera-overlay" id="cameraOverlay">
  <button class="cancel-overlay-btn" id="cancelStreamBtn">✕</button>
  <div class="camera-frame">
    <div class="camera-stage" id="cameraStage">
      <video id="inlineVideo" autoplay playsinline muted></video>
      <div class="preview-overlay-grid">
        <div class="preview-slot-box"><span class="preview-slot-num">1</span></div>
        <div class="preview-slot-box"><span class="preview-slot-num">2</span></div>
        <div class="preview-slot-box"><span class="preview-slot-num">3</span></div>
        <div class="preview-slot-box"><span class="preview-slot-num">4</span></div>
        <div class="preview-slot-box"><span class="preview-slot-num">5</span></div>
        <div class="preview-slot-box"><span class="preview-slot-num">6</span></div>
      </div>
    </div>
  </div>
  <button class="shutter-overlay-btn" id="takePhotoBtn" title="Capture frame"></button>
</div>


<script>
// --- Nature reference data ---
const NATURES = [
  { name: "Adamant", up: "Atk", down: "SpA" },
  { name: "Bold", up: "Def", down: "Atk" },
  { name: "Brave", up: "Atk", down: "Spe" },
  { name: "Calm", up: "SpD", down: "Atk" },
  { name: "Careful", up: "SpD", down: "SpA" },
  { name: "Gentle", up: "SpD", down: "Def" },
  { name: "Hasty", up: "Spe", down: "Def" },
  { name: "Impish", up: "Def", down: "SpA" },
  { name: "Jolly", up: "Spe", down: "SpA" },
  { name: "Lax", up: "Def", down: "SpD" },
  { name: "Lonely", up: "Atk", down: "Def" },
  { name: "Mild", up: "SpA", down: "Def" },
  { name: "Modest", up: "SpA", down: "Atk" },
  { name: "Naive", up: "Spe", down: "SpD" },
  { name: "Naughty", up: "Atk", down: "SpD" },
  { name: "Quiet", up: "SpA", down: "Spe" },
  { name: "Rash", up: "SpA", down: "SpD" },
  { name: "Relaxed", up: "Def", down: "Spe" },
  { name: "Sassy", up: "SpD", down: "Spe" },
  { name: "Timid", up: "Spe", down: "Atk" },
  { name: "Hardy", up: null, down: null },
  { name: "Docile", up: null, down: null },
  { name: "Serious", up: null, down: null },
  { name: "Bashful", up: null, down: null },
  { name: "Quirky", up: null, down: null },
];

// Targets the bottom-right watermarked numbers (1-6) of each card slot
const GRID_FALLBACK = [
  { x: 26.0, y: 38.2, rotation: 0 },
  { x: 68.0, y: 38.2, rotation: 0 },
  { x: 26.0, y: 58.4, rotation: 0 },
  { x: 68.0, y: 58.4, rotation: 0 },
  { x: 26.0, y: 78.6, rotation: 0 },
  { x: 68.0, y: 78.6, rotation: 0 },
];

// --- State ---
let photo = null;
let photoDims = { w: 0, h: 0 };
let labels = [];
let activeId = null;
let dragId = null;
let stream = null;
let isStreaming = false;

// --- DOM references ---
const previewBox = document.getElementById('previewBox');
const rosterCard = document.getElementById('rosterCard');
const rosterList = document.getElementById('rosterList');
const hintCard = document.getElementById('hintCard');
const hint = document.getElementById('hint');
const fileInput = document.getElementById('fileInput');
const cameraInput = document.getElementById('cameraInput');
const cameraBtn = document.getElementById('cameraBtn');
const libraryBtn = document.getElementById('libraryBtn');
const clearAllBtn = document.getElementById('clearAllBtn');
const downloadBtn = document.getElementById('downloadBtn');
const gridBtn = document.getElementById('gridBtn');
const tagCount = document.getElementById('tagCount');
const cameraOverlay = document.getElementById('cameraOverlay');
const cameraStage = document.getElementById('cameraStage');
const inlineVideo = document.getElementById('inlineVideo');
const cancelStreamBtn = document.getElementById('cancelStreamBtn');
const takePhotoBtn = document.getElementById('takePhotoBtn');

try {
  const saved = localStorage.getItem("nature-tagger:labels");
  if (saved) labels = JSON.parse(saved);
} catch(e){}

function saveState(){
  try { localStorage.setItem("nature-tagger:labels", JSON.stringify(labels)); } catch(e){}
}

function newLabel(x, y, rotation = 0){
  return {
    id: `lbl-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
    nature: '',
    x, y, rotation, size: 1, color: '#ffffff'
  };
}

// --- Photo loading (library / file input) ---
libraryBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files?.[0];
  if (file) loadFile(file);
});

cameraInput.addEventListener('change', (e) => {
  const file = e.target.files?.[0];
  if (file) loadFile(file);
});

function loadFile(file){
  const reader = new FileReader();
  reader.onload = (e) => loadDataUrl(e.target.result);
  reader.readAsDataURL(file);
}

function loadDataUrl(url){
  stopCameraStream();
  const img = new Image();
  img.onload = () => {
    photo = url;
    photoDims = { w: img.naturalWidth, h: img.naturalHeight };
    labels = [];
    activeId = null;
    render();
  };
  img.src = url;
}

// --- Live camera capture ---
let lastRequestedFacing = 'environment';

function stopCameraStream(){
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  isStreaming = false;
}
function updateOrientationFix() {
  const angle = screen.orientation ? screen.orientation.angle : window.orientation || 0;
  const isLandscape = Math.abs(angle) === 90;
  cameraStage.classList.toggle('ios-landscape-fix', isLandscape);

  if (isLandscape) {
    inlineVideo.style.width = cameraStage.clientHeight + 'px';
    inlineVideo.style.height = cameraStage.clientWidth + 'px';
  } else {
    inlineVideo.style.width = '';
    inlineVideo.style.height = '';
  }
}

window.addEventListener('orientationchange', updateOrientationFix);
window.addEventListener('resize', updateOrientationFix);

function openCameraOverlay(){
  inlineVideo.srcObject = stream;
  cameraOverlay.classList.add('open');
  updateOrientationFix(); 
}

function closeCameraOverlay(){
  cameraOverlay.classList.remove('open');
  inlineVideo.srcObject = null;
}

cameraBtn.addEventListener('click', async () => {
  if (window.location.protocol === 'file:') {
    alert("Webcams require Live Server to run. Opening file chooser instead.");
    cameraInput.click();
    return;
  }

  try {
    let constraints = {
      video: { facingMode: "environment", aspectRatio: { ideal: 1.777777778 } },
      audio: false
    };
    lastRequestedFacing = 'environment';

    if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(d => d.kind === 'videoinput');
      const iriun = videoDevices.find(d => d.label.toLowerCase().includes('iriun'));

      if (iriun) {
        constraints = { video: { deviceId: { exact: iriun.deviceId } }, audio: false };
        lastRequestedFacing = 'user';
      }
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (e) {
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      lastRequestedFacing = 'user';
    }

    isStreaming = true;
    openCameraOverlay();

  } catch (err) {
    console.error("Camera access failed:", err);
    alert("Could not access webcam. Make sure camera permissions are granted.");
    cameraInput.click();
  }
});

cancelStreamBtn.addEventListener('click', () => {
  stopCameraStream();
  closeCameraOverlay();
});

takePhotoBtn.addEventListener('click', () => {
  if (!inlineVideo.videoWidth || !inlineVideo.videoHeight) return;

  const vw = inlineVideo.videoWidth;
  const vh = inlineVideo.videoHeight;
  const targetAspect = 16 / 9;
  const currentAspect = vw / vh;

  let sw = vw, sh = vh, sx = 0, sy = 0;

  // Compute 16:9 crop bounds matching CSS object-fit: cover
  if (currentAspect > targetAspect) {
    sw = vh * targetAspect;
    sx = (vw - sw) / 2;
  } else {
    sh = vw / targetAspect;
    sy = (vh - sh) / 2;
  }

  const canvas = document.createElement("canvas");
  canvas.width = 1280;
  canvas.height = 720;
  const ctx = canvas.getContext("2d");


  // Draw ONLY the cropped 16:9 viewport area
  ctx.drawImage(inlineVideo, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

  stopCameraStream();
  closeCameraOverlay();
  loadDataUrl(canvas.toDataURL("image/jpeg", 0.92));
});

// --- Auto grid placement ---
gridBtn.addEventListener('click', () => {
  labels = GRID_FALLBACK.map(s => newLabel(s.x, s.y, s.rotation));
  activeId = null;
  render();
});

// --- Label roster ---
function setActive(id){
  activeId = activeId === id ? null : id;
  render();
}

function updateLabel(id, key, val){
  const l = labels.find(x => x.id === id);
  if (l) l[key] = val;
  render();
}

function removeLabel(id){
  labels = labels.filter(l => l.id !== id);
  if (activeId === id) activeId = null;
  render();
}

previewBox.addEventListener('click', (e) => {
  if (!photo || e.target !== previewBox) return;
  const rect = previewBox.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 100;
  const y = ((e.clientY - rect.top) / rect.height) * 100;
  const newLbl = newLabel(x, y);
  labels.push(newLbl);
  activeId = newLbl.id;
  render();
});

function onLabelDown(e, id){
  e.preventDefault();
  e.stopPropagation();
  setActive(id);
  dragId = id;

  function move(ev){
    const rect = previewBox.getBoundingClientRect();
    const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
    let x = ((clientX - rect.left) / rect.width) * 100;
    let y = ((clientY - rect.top) / rect.height) * 100;
    x = Math.max(2, Math.min(98, x));
    y = Math.max(2, Math.min(98, y));
    const l = labels.find(lbl => lbl.id === dragId);
    if (l) { l.x = x; l.y = y; render(); }
  }

  function up(){
    dragId = null;
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('touchmove', move);
    window.removeEventListener('touchend', up);
  }

  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', up);
}

clearAllBtn.addEventListener('click', () => {
  labels = [];
  activeId = null;
  render();
});

// --- Export annotated image ---
downloadBtn.addEventListener('click', async () => {
  if (!photo || !photoDims.w) return;
  downloadBtn.disabled = true;

  const canvas = document.createElement('canvas');
  canvas.width = photoDims.w;
  canvas.height = photoDims.h;
  const ctx = canvas.getContext('2d');

  const img = new Image();
  await new Promise(res => { img.onload = res; img.src = photo; });

  ctx.drawImage(img, 0, 0, photoDims.w, photoDims.h);

  labels.forEach(l => {
    if (!l.nature) return;
    const px = (l.x / 100) * photoDims.w;
    const py = (l.y / 100) * photoDims.h;
    const fontSize = (photoDims.w / 24) * (l.size || 1);
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(((l.rotation || 0) * Math.PI) / 180);
    ctx.font = `700 ${fontSize}px 'Space Grotesk', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = fontSize * 0.08;
    ctx.strokeStyle = l.color === '#ffffff' ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.6)';
    ctx.strokeText(l.nature, 0, 0);
    ctx.fillStyle = l.color || '#ffffff';
    ctx.fillText(l.nature, 0, 0);
    ctx.restore();
  });

  const url = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url;
  a.download = 'nature-tagged-team.png';
  a.click();

  downloadBtn.disabled = false;
});

// --- Render ---
function render(){
  gridBtn.style.display = photo ? 'inline-block' : 'none';

  if (photo) {
    previewBox.innerHTML = `<img src="${photo}" alt="Team">`;
    labels.forEach(l => {
      const label = document.createElement('div');
      label.className = `label-overlay ${activeId === l.id ? 'active' : ''}`;
      label.style.left = `${l.x}%`;
      label.style.top = `${l.y}%`;
      label.style.transform = `translate(-50%, -50%) rotate(${l.rotation || 0}deg) scale(${l.size || 1})`;
      label.style.color = l.color;
      label.textContent = l.nature || '?';
      label.addEventListener('mousedown', (e) => onLabelDown(e, l.id));
      label.addEventListener('touchstart', (e) => onLabelDown(e, l.id));
      previewBox.appendChild(label);
    });
  } else {
    previewBox.innerHTML = '<div class="preview-placeholder">No photo loaded</div>';
  }

  if (labels.length > 0) {
    rosterCard.style.display = 'block';
    hintCard.style.display = 'none';
    tagCount.textContent = `${labels.filter(l => l.nature).length} tagged`;
    rosterList.innerHTML = labels.map((l, i) => `
      <div class="roster-item ${activeId === l.id ? 'active' : ''}" onclick="setActive('${l.id}')">
        <div class="roster-main-row">
          <div class="roster-index">${i + 1}</div>
          <select class="roster-nature" onchange="updateLabel('${l.id}', 'nature', this.value)" onclick="event.stopPropagation()">
            <option value="">Nature…</option>
            ${NATURES.map(n => `<option value="${n.name}" ${l.nature === n.name ? 'selected' : ''}>${n.name}${n.up ? ` (+${n.up}/-${n.down})` : ' (neutral)'}</option>`).join('')}
          </select>
          <button class="roster-delete" onclick="event.stopPropagation(); removeLabel('${l.id}')">✕</button>
        </div>
        ${activeId === l.id ? `
          <div class="roster-tools" onclick="event.stopPropagation()">
            <label><span>Size:</span><input type="range" min="0.6" max="1.8" step="0.1" value="${l.size || 1}" oninput="updateLabel('${l.id}', 'size', parseFloat(this.value))"></label>
            <label><span>Rotate:</span><input type="range" min="-45" max="45" step="1" value="${l.rotation || 0}" oninput="updateLabel('${l.id}', 'rotation', parseInt(this.value))"></label>
          </div>
        ` : ''}
      </div>
    `).join('');
  } else {
    rosterCard.style.display = 'none';
    hintCard.style.display = 'block';
  }

  clearAllBtn.disabled = labels.length === 0;
  downloadBtn.disabled = !photo || labels.length === 0;
  saveState();
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => { /* ignore on unsupported hosts */ });
  });
}
</script>
</body>
