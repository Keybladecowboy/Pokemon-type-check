<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature Tagger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg:#161213;
    --panel:#201819;
    --panel-2:#2a1c1d50;
    --line:#3a2224;
    --text:#f7eeee;
    --dim:#a68a8a;
    --accent:#e0242a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #2a1414 0%, transparent 45%),
      radial-gradient(circle at 100% 30%, #241010 0%, transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    padding:20px 12px 50px;
  }
  .wrap{max-width:720px; margin:0 auto;}

  .device-frame{
    background: linear-gradient(155deg, #ec3a3f 0%, #c81820 55%, #a3141a 100%);
    border-radius:26px;
    padding:14px 14px 20px;
    box-shadow: 0 12px 30px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.25), inset 0 -6px 14px rgba(0,0,0,.25);
    margin-bottom:8px;
  }
  .device-top{
    display:flex;
    align-items:center;
    gap:10px;
    padding:4px 6px 14px;
  }
  .lens{
    width:30px; height:30px;
    border-radius:50%;
    background:radial-gradient(circle at 32% 30%, #d8f4ff 0%, #6fc3ef 35%, #1c7fb8 70%, #0e4d70 100%);
    border:3px solid #fff;
    box-shadow:0 0 0 2px rgba(0,0,0,.2), 0 2px 4px rgba(0,0,0,.3);
    flex-shrink:0;
  }
  .status-dots{display:flex; gap:5px; margin-left:2px;}
  .status-dots span{
    width:7px; height:7px; border-radius:50%;
    box-shadow:0 1px 2px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,.3);
  }
  .status-dots .d1{background:#ff5c5c;}
  .status-dots .d2{background:#ffd23f;}
  .status-dots .d3{background:#57d97a;}
  .device-top .device-label{
    margin-left:auto;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.14em;
    color:rgba(255,255,255,.75);
    text-transform:uppercase;
  }

  .screen{
    background:var(--bg);
    border-radius:16px;
    padding:20px 16px 8px;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.35), inset 0 3px 10px rgba(0,0,0,.5);
  }

  .device-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 10px 2px;
    flex-wrap:wrap;
    gap:8px;
  }
  .bezel-btn{
    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.15);
    color:rgba(255,255,255,.85);
    font-size:11px;
    font-weight:600;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-family:'Space Grotesk', sans-serif;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.3);
  }
  .bezel-btn:hover{background:rgba(0,0,0,.35); border-color:rgba(255,255,255,.3);}
  .bezel-btn:disabled{opacity:0.4; cursor:not-allowed;}
  .bezel-btn.accent{background:var(--accent); color:#fff;}
  .speaker-lines{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .speaker-lines span{
    display:block;
    width:60px; height:4px;
    border-radius:2px;
    background:rgba(0,0,0,.3);
    box-shadow:0 1px 0 rgba(255,255,255,.12);
  }
  .speaker-lines span:nth-child(2){width:44px;}
  .speaker-lines span:nth-child(3){width:52px;}

  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:8px;
  }
  h1{
    font-size:clamp(28px,7vw,40px);
    font-weight:700;
    margin:0 0 8px;
    letter-spacing:-0.02em;
  }
  header p{
    color:var(--dim);
    font-size:14.5px;
    line-height:1.5;
    margin:0;
    max-width:52ch;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
  }
  .card h2{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--dim);
    margin:0 0 14px;
    font-weight:600;
  }

  .preview-box{
    width:100%;
    aspect-ratio:3/2;
    background:#12131c;
    border:1px solid var(--line);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    margin-bottom:14px;
  }
  .preview-box img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  .preview-placeholder{
    color:var(--dim);
    font-size:13px;
    text-align:center;
  }

  .label-overlay{
    position:absolute;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:12px;
    cursor:grab;
    user-select:none;
    touch-action:none;
    padding:4px 8px;
  }
  .label-overlay:active{cursor:grabbing;}
  .label-overlay.active{
    outline:2px dashed var(--accent);
    outline-offset:3px;
  }

  .roster-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    margin-bottom:10px;
    background:rgba(255,255,255,.02);
    border:1px solid var(--line);
    border-radius:10px;
    cursor:pointer;
  }
  .roster-item:hover{border-color:var(--accent); background:rgba(224,36,42,.05);}
  .roster-item.active{border-color:var(--accent); background:rgba(224,36,42,.1);}

  .roster-index{
    display:flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    border-radius:50%;
    border:1px solid var(--dim);
    font-size:12px;
    font-weight:700;
    flex-shrink:0;
  }

  .roster-nature select{
    background:#12131c;
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--text);
    padding:6px 10px;
    font-size:12px;
    font-family:'Space Grotesk', sans-serif;
    cursor:pointer;
    flex:1;
  }

  .roster-delete{
    color:var(--accent);
    background:none;
    border:none;
    font-size:14px;
    cursor:pointer;
    padding:0;
  }

  input[type="file"]{ display:none; }
  
  .footer-hint{
    text-align:center;
    color:var(--dim);
    font-size:12px;
    margin-top:16px;
  }
</style>
</head>
<body>
<div class="wrap">
<div class="device-frame">
  <div class="device-top">
    <div class="lens"></div>
    <div class="status-dots"><span class="d1"></span><span class="d2"></span><span class="d3"></span></div>
    <a href="./index.html" class="device-label" style="cursor:pointer; text-decoration:none; background:#a9a9a9; color:#ffffff; padding:6px 12px; border-radius:6px; border:1px solid #888; display:inline-block; transition:.15s; box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 2px 4px rgba(0,0,0,.3); font-weight:600;">Type Check</a>
  </div>
  <div class="screen">
  <header>
    <div class="eyebrow">Nature Tagger // 002</div>
    <h1>Tag team natures</h1>
    <p>Load a team screenshot, place nature labels on each Pokémon, and download the annotated image.</p>
  </header>

  <div class="card">
    <h2>Load Photo</h2>
    <div class="preview-box" id="previewBox">
      <div class="preview-placeholder">No photo loaded</div>
    </div>
  </div>

  <div class="card" id="rosterCard" style="display:none;">
    <h2>Label Natures</h2>
    <div id="rosterList"></div>
  </div>

  <div class="footer-hint" id="hint">
    Tap "Photo" or "Library" to load a team screenshot.
  </div>
  </div>

  <input id="fileInput" type="file" accept="image/*">
  <input id="cameraInput" type="file" accept="image/*" capture="environment">

  <div class="device-bottom">
    <button class="bezel-btn" id="cameraBtn">📷 Photo</button>
    <button class="bezel-btn" id="libraryBtn">🖼 Library</button>
    <button class="bezel-btn" id="clearAllBtn" disabled>🗑 Clear</button>
    <button class="bezel-btn accent" id="downloadBtn" disabled>⬇ Save</button>
    <div class="speaker-lines"><span></span><span></span><span></span></div>
  </div>
</div>
</div>

<script>
const NATURES = [
  { name: "Adamant", up: "Atk", down: "SpA" },
  { name: "Bold", up: "Def", down: "Atk" },
  { name: "Brave", up: "Atk", down: "Spe" },
  { name: "Calm", up: "SpD", down: "Atk" },
  { name: "Careful", up: "SpD", down: "SpA" },
  { name: "Gentle", up: "SpD", down: "Def" },
  { name: "Hasty", up: "Spe", down: "Def" },
  { name: "Impish", up: "Def", down: "SpA" },
  { name: "Jolly", up: "Spe", down: "SpA" },
  { name: "Lax", up: "Def", down: "SpD" },
  { name: "Lonely", up: "Atk", down: "Def" },
  { name: "Mild", up: "SpA", down: "Def" },
  { name: "Modest", up: "SpA", down: "Atk" },
  { name: "Naive", up: "Spe", down: "SpD" },
  { name: "Naughty", up: "Atk", down: "SpD" },
  { name: "Quiet", up: "SpA", down: "Spe" },
  { name: "Rash", up: "SpA", down: "SpD" },
  { name: "Relaxed", up: "Def", down: "Spe" },
  { name: "Sassy", up: "SpD", down: "Spe" },
  { name: "Timid", up: "Spe", down: "Atk" },
  { name: "Hardy", up: null, down: null },
  { name: "Docile", up: null, down: null },
  { name: "Serious", up: null, down: null },
  { name: "Bashful", up: null, down: null },
  { name: "Quirky", up: null, down: null },
];

let photo = null;
let photoDims = { w: 0, h: 0 };
let labels = [];
let activeId = null;
let dragId = null;

const previewBox = document.getElementById('previewBox');
const rosterCard = document.getElementById('rosterCard');
const rosterList = document.getElementById('rosterList');
const hint = document.getElementById('hint');
const fileInput = document.getElementById('fileInput');
const cameraInput = document.getElementById('cameraInput');
const cameraBtn = document.getElementById('cameraBtn');
const libraryBtn = document.getElementById('libraryBtn');
const clearAllBtn = document.getElementById('clearAllBtn');
const downloadBtn = document.getElementById('downloadBtn');

cameraBtn.addEventListener('click', () => cameraInput.click());
libraryBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  loadFile(file);
});

cameraInput.addEventListener('change', (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  loadFile(file);
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      photo = e.target.result;
      photoDims = { w: img.naturalWidth, h: img.naturalHeight };
      labels = [];
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function newLabel(x, y) {
  return {
    id: `lbl-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
    nature: '',
    x, y,
    color: '#ffffff',
  };
}

function render() {
  if (photo) {
    previewBox.innerHTML = `<img src="${photo}" alt="Team">`;
    labels.forEach(l => {
      const label = document.createElement('div');
      label.className = `label-overlay ${activeId === l.id ? 'active' : ''}`;
      label.style.left = `${l.x}%`;
      label.style.top = `${l.y}%`;
      label.style.transform = 'translate(-50%, -50%)';
      label.style.color = l.color;
      label.textContent = l.nature || '?';
      label.addEventListener('mousedown', (e) => onLabelDown(e, l.id));
      label.addEventListener('touchstart', (e) => onLabelDown(e, l.id));
      previewBox.appendChild(label);
    });
  } else {
    previewBox.innerHTML = '<div class="preview-placeholder">No photo loaded</div>';
  }

  if (labels.length > 0) {
    rosterCard.style.display = 'block';
    hint.style.display = 'none';
    rosterList.innerHTML = labels.map((l, i) => `
      <div class="roster-item ${activeId === l.id ? 'active' : ''}" onclick="setActive('${l.id}')">
        <div class="roster-index">${i + 1}</div>
        <select class="roster-nature" onchange="updateLabel('${l.id}', this.value)" onclick="event.stopPropagation()">
          <option value="">Nature…</option>
          ${NATURES.map(n => `<option value="${n.name}" ${l.nature === n.name ? 'selected' : ''}>${n.name}${n.up ? ` (+${n.up}/-${n.down})` : ' (neutral)'}</option>`).join('')}
        </select>
        <button class="roster-delete" onclick="event.stopPropagation(); removeLabel('${l.id}')">✕</button>
      </div>
    `).join('');
  } else {
    rosterCard.style.display = 'none';
    hint.style.display = 'block';
  }

  clearAllBtn.disabled = labels.length === 0;
  downloadBtn.disabled = !photo || labels.length === 0;
}

function setActive(id) {
  activeId = activeId === id ? null : id;
  render();
}

function updateLabel(id, nature) {
  const l = labels.find(x => x.id === id);
  if (l) l.nature = nature;
  render();
}

function removeLabel(id) {
  labels = labels.filter(l => l.id !== id);
  if (activeId === id) activeId = null;
  render();
}

// Add label by clicking preview
previewBox.addEventListener('click', (e) => {
  if (!photo || e.target !== previewBox) return;
  const rect = previewBox.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 100;
  const y = ((e.clientY - rect.top) / rect.height) * 100;
  const newLbl = newLabel(x, y);
  labels.push(newLbl);
  activeId = newLbl.id;
  render();
});

function onLabelDown(e, id) {
  e.preventDefault();
  setActive(id);
  dragId = id;

  function move(ev) {
    const rect = previewBox.getBoundingClientRect();
    const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
    let x = ((clientX - rect.left) / rect.width) * 100;
    let y = ((clientY - rect.top) / rect.height) * 100;
    x = Math.max(2, Math.min(98, x));
    y = Math.max(2, Math.min(98, y));
    const l = labels.find(lbl => lbl.id === dragId);
    if (l) {
      l.x = x;
      l.y = y;
      render();
    }
  }

  function up() {
    dragId = null;
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('touchmove', move);
    window.removeEventListener('touchend', up);
  }

  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', up);
}

clearAllBtn.addEventListener('click', () => {
  labels = [];
  activeId = null;
  render();
});

downloadBtn.addEventListener('click', async () => {
  if (!photo || !photoDims.w) return;
  downloadBtn.disabled = true;

  const canvas = document.createElement('canvas');
  canvas.width = photoDims.w;
  canvas.height = photoDims.h;
  const ctx = canvas.getContext('2d');

  const img = new Image();
  await new Promise(res => {
    img.onload = res;
    img.src = photo;
  });

  ctx.drawImage(img, 0, 0, photoDims.w, photoDims.h);

  labels.forEach(l => {
    if (!l.nature) return;
    const px = (l.x / 100) * photoDims.w;
    const py = (l.y / 100) * photoDims.h;
    const fontSize = photoDims.w / 20;
    ctx.save();
    ctx.translate(px, py);
    ctx.font = `bold ${fontSize}px 'Space Grotesk'`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = fontSize * 0.08;
    ctx.strokeStyle = l.color === '#ffffff' ? 'rgba(0,0,0,0.5)' : 'rgba(255,255,255,0.5)';
    ctx.strokeText(l.nature, 0, 0);
    ctx.fillStyle = l.color;
    ctx.fillText(l.nature, 0, 0);
    ctx.restore();
  });

  const url = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url;
  a.download = 'nature-tagged-team.png';
  a.click();

  downloadBtn.disabled = false;
});

render();
</script>
</body>
</html>
